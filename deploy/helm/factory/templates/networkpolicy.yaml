{{- if .Values.networkPolicy.enabled }}
# Workers accept no inbound traffic. They reach DNS, the control plane and the listed egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-worker
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: factory, app.kubernetes.io/component: worker, app.kubernetes.io/instance: {{ .Release.Name }}}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to: [{namespaceSelector: {}, podSelector: {matchLabels: {k8s-app: kube-dns}}}]
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/component: plane, app.kubernetes.io/instance: {{ .Release.Name }}}}}]
      ports: [{port: {{ .Values.controlPlane.port }}, protocol: TCP}]
    {{- with .Values.networkPolicy.publicEgress }}
    {{- if .enabled }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- range .except }}
              - {{ . }}
              {{- end }}
              {{- with .podCIDR }}
              - {{ . }}
              {{- end }}
              {{- with .serviceCIDR }}
              - {{ . }}
              {{- end }}
      ports: {{ toYaml .ports | nindent 8 }}
    {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.workerEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-plane
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: factory, app.kubernetes.io/component: plane, app.kubernetes.io/instance: {{ .Release.Name }}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/component: worker, app.kubernetes.io/instance: {{ .Release.Name }}}}}]
      ports: [{port: {{ .Values.controlPlane.port }}, protocol: TCP}]
{{- end }}
