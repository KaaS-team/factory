{{- range .Values.pools }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-worker-{{ .name }}
spec:
  replicas: {{ .replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: factory, app.kubernetes.io/component: worker, app.kubernetes.io/instance: {{ $.Release.Name }}, factory/pool: {{ .name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: factory, app.kubernetes.io/component: worker, app.kubernetes.io/instance: {{ $.Release.Name }}, factory/pool: {{ .name }}}
    spec:
      serviceAccountName: {{ include "factory.sa" $ }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .terminationGraceSeconds | default 330 }}
      securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: {{ include "factory.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args:
            - worker
            - run
            - --plane={{ include "factory.planeURL" $ }}
            - --token-file=/etc/factory/token
            - --drain={{ .drain | default "5m" }}
            {{- range $k, $v := .labels }}
            - --label={{ $k }}={{ $v }}
            {{- end }}
            {{- range .capabilities }}
            - --cap={{ . }}
            {{- end }}
          resources: {{ toYaml .resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: token, mountPath: /etc/factory, readOnly: true}
            - {name: work, mountPath: /work}
      volumes:
        - name: token
          secret:
            secretName: {{ .tokenSecret }}
            defaultMode: 0400
        - name: work
          emptyDir: {}
{{- end }}
